name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify production build paths
        run: |
          test -f dist/index.html
          test -f dist/404.html
          grep -q '/athar-store/assets/' dist/index.html
          # Fail if Vite env vars were missing at build time (client would be unconfigured).
          # Note: do not grep for "your-athar" strings — those appear in client-side validation regexes.
          if ! grep -R -n 'rotcgsayspiphcisepmu' dist/assets >/dev/null; then
            echo 'Expected athar Supabase project ref missing from build output — check Actions secrets' >&2
            exit 1
          fi
          if grep -R -n 'https://your-athar-project-ref.supabase.co' dist/ >/dev/null; then
            echo 'Placeholder Supabase URL found in dist' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
